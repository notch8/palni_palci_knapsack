worker:
  resources:
    limits:
      memory: "6Gi"
      cpu: "1000m"
    requests:
      memory: "3Gi"
      cpu: "100m"
  replicaCount: 1
  extraVolumeMounts: *volMounts
  extraEnvVars: *envVars
  podSecurityContext:
    runAsUser: 1001
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: "OnRootMismatch"
podSecurityContext:
  runAsUser: 1001
  runAsGroup: 101
  fsGroup: 101
  fsGroupChangePolicy: "OnRootMismatch"

# When adding/removing key-value pairs to this block, ensure the
# corresponding changes are made in the `extraDeploy` block below.
workerAuxiliary:
  replicaCount: 1
  resources:
    limits:
      memory: "4Gi"
      cpu: "1000m"
    requests:
      memory: "2Gi"
      cpu: "100m"
  extraEnvVars:
    - name: AUXILIARY_WORKER_THREAD_COUNT
      value: "1"
    - name: SIDEKIQ_CONFIG
      value: "config/sidekiq_auxiliary.yml"

extraDeploy:
  - |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: {{ include "hyrax.fullname" . }}-auxiliary-worker
        labels:
          {{- include "hyrax.labels" . | nindent 4 }}
      spec:
        replicas: {{ .Values.workerAuxiliary.replicaCount }}
        selector:
          matchLabels:
            {{- include "hyrax.workerSelectorLabels" . | nindent 6 }}
        template:
          metadata:
          {{- with .Values.podAnnotations }}
            annotations:
              {{- toYaml . | nindent 8 }}
          {{- end }}
            labels:
              {{- include "hyrax.workerSelectorLabels" . | nindent 8 }}
          spec:
            initContainers:
              - name: service-wait
                image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
                imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
                envFrom:
                  - configMapRef:
                      name: {{ include "hyrax.fullname" . }}-env
                  - secretRef:
                      name: {{ template "hyrax.fullname" . }}
                env:
                  {{- toYaml .Values.workerAuxiliary.extraEnvVars | nindent 12 }}
                  {{- toYaml .Values.worker.extraEnvVars | nindent 12 }}
                command:
                  - sh
                  - -c
                  - "service-wait.sh {{ include "hyrax.redis.host" . }}:6379"
              {{- if .Values.worker.extraInitContainers }}
              {{- toYaml .Values.worker.extraInitContainers | nindent 8 }}
              {{- end }}
            {{- with .Values.imagePullSecrets }}
            imagePullSecrets:
              {{- toYaml . | nindent 8 }}
            {{- end }}
            serviceAccountName: {{ include "hyrax.serviceAccountName" . }}
            securityContext:
              {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
            containers:
              - name: {{ .Chart.Name }}-worker
                securityContext:
                  {{- toYaml .Values.worker.securityContext | nindent 12 }}
                image: "{{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag | default .Chart.AppVersion }}"
                imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
                envFrom:
                  - configMapRef:
                      name: {{ include "hyrax.fullname" . }}-env
                  - secretRef:
                      name: {{ template "hyrax.fullname" . }}
                  {{- if .Values.solrExistingSecret }}
                  - secretRef:
                      name: {{ .Values.solrExistingSecret }}
                  {{- end }}
                  {{- with .Values.worker.extraEnvFrom }}
                    {{- toYaml . | nindent 12 }}
                  {{- end }}
                env:
                  {{- toYaml .Values.workerAuxiliary.extraEnvVars | nindent 12 }}
                  {{- toYaml .Values.worker.extraEnvVars | nindent 12 }}
                {{- if .Values.worker.readinessProbe.enabled }}
                readinessProbe:
                  exec:
                    command:
                      {{- toYaml .Values.worker.readinessProbe.command | nindent 16 }}
                  failureThreshold: {{ .Values.worker.readinessProbe.failureThreshold }}
                  initialDelaySeconds: {{ .Values.worker.readinessProbe.initialDelaySeconds }}
                  periodSeconds: {{ .Values.worker.readinessProbe.periodSeconds }}
                  successThreshold: {{ .Values.worker.readinessProbe.successThreshold }}
                  timeoutSeconds: {{ .Values.worker.readinessProbe.timeoutSeconds }}
                {{- end }}
                volumeMounts:
                  - name: derivatives
                    mountPath: /app/samvera/derivatives
                  - name: uploads
                    subPath: file_cache
                    mountPath: /app/samvera/file_cache
                  - name: uploads
                    subPath: uploads
                    mountPath: /app/samvera/uploads
                  {{- if .Values.applicationExistingClaim }}
                  - name: application
                    mountPath: /app/samvera/hyrax-webapp
                  {{- end }}
                  {{- with .Values.worker.extraVolumeMounts }}
                  {{- toYaml . | nindent 12 }}
                  {{- end }}
                resources:
                  {{- toYaml .Values.workerAuxiliary.resources | nindent 12 }}
                {{- with .Values.extraContainerConfiguration }}
                {{- toYaml . | nindent 10 }}
                {{- end }}
            volumes:
              - name: "derivatives"
                {{- if and .Values.derivativesVolume.enabled .Values.derivativesVolume.existingClaim }}
                persistentVolumeClaim:
                  claimName: {{ .Values.derivativesVolume.existingClaim }}
                {{- else if .Values.derivativesVolume.enabled }}
                persistentVolumeClaim:
                  claimName: {{ template "hyrax.fullname" . }}-derivatives
                {{ else }}
                emptyDir: {}
                {{ end }}
              - name: "uploads"
                {{- if and .Values.uploadsVolume.enabled .Values.uploadsVolume.existingClaim }}
                persistentVolumeClaim:
                  claimName: {{ .Values.uploadsVolume.existingClaim }}
                {{- else if .Values.uploadsVolume.enabled }}
                persistentVolumeClaim:
                  claimName: {{ template "hyrax.fullname" . }}-uploads
                {{ else }}
                emptyDir: {}
                {{ end }}
              {{- if .Values.applicationExistingClaim }}
              - name: "application"
                persistentVolumeClaim:
                  claimName: {{ .Values.applicationExistingClaim }}
              {{- end }}
              {{- with .Values.worker.extraVolumes }}
              {{- toYaml . | nindent 8 }}
              {{- end }}
            {{- with .Values.worker.nodeSelector }}
            nodeSelector:
              {{- toYaml . | nindent 8 }}
            {{- end }}
            {{- with .Values.worker.affinity }}
            affinity:
              {{- toYaml . | nindent 8 }}
            {{- end }}
            {{- with .Values.worker.tolerations }}
            tolerations:
              {{- toYaml . | nindent 8 }}
            {{- end }}

embargoRelease:
  enabled: false
leaseRelease:
  enabled: false

fcrepo:
  resources:
    limits:
      memory: "4Gi"
      cpu: "1000m"
    requests:
      memory: "3Gi"
      cpu: "100m"
  enabled: true
  servicePort: 8080
  postgresql:
    primary:
      resources:
        limits:
          memory: "1Gi"
          cpu: "500m"
        requests:
          memory: "512Mi"
          cpu: "50m"
    enabled: true
    image:
      repository: bitnamilegacy/postgresql
      tag: 12.3.0
    auth:
      username: fcrepo
      password: $DB_PASSWORD
      database: fcrepo
    containerPorts:
      postgresql: 5432
  livenessProbe:
    initialDelaySeconds: 90
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 90
    failureThreshold: 6
  s3:
    enabled: true
    bucket: besties-fcrepo-clone
    access_key: $AWS_ACCESS_KEY_ID
    secret_key: $AWS_SECRET_ACCESS_KEY
global:
  # These global postgresql values are used by the fcrepo chart
  postgresql:
    auth:
      username: fcrepo
      password: $DB_PASSWORD
      postgresPassword: $DB_PASSWORD
  # Required for the nginx serverBlock's `upstream rails_app` to resolve
  hyraxHostName: palni-palci-knapsack-friends-hyrax
postgresql:
  enabled: false
  pool: 10
redis:
  master:
    resources:
      limits:
        memory: "512Mi"
        cpu: "100m"
      requests:
        memory: "256Mi"
        cpu: "20m"
  image:
    repository: bitnamilegacy/redis
    tag: 7.0.2-debian-11-r7
  enabled: true
  architecture: standalone
  auth:
    password: $REDIS_PASSWORD
solr:
  enabled: false
fits:
  enabled: true
  servicePort: 8080
  subPath: /fits
  resources:
    limits:
      memory: "2Gi"
      cpu: "1000m"
    requests:
      memory: "1Gi"
      cpu: "250m"
  livenessProbe:
    initialDelaySeconds: 60
    failureThreshold: 6
  readinessProbe:
    initialDelaySeconds: 60
    failureThreshold: 6
externalPostgresql:
  host: postgres-postgresql.postgres.svc.cluster.local
  username: postgres
  database: palni-palci-knapsack-friends
  password: $DB_PASSWORD

externalSolrHost: solr.solr.svc.cluster.local
externalSolrUser: admin
externalSolrCollection: "palni-palci-knapsack-friends"
externalSolrPassword: $SOLR_ADMIN_PASSWORD

nginx:
  enabled: true
  service:
    type: ClusterIP
  image:
    repository: "ghcr.io/$REPO_LOWER/nginx"
    tag: "$TAG"
  extraVolumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: "{{ .Values.global.hyraxHostName }}-uploads"
  extraVolumeMounts:
    - name: uploads
      mountPath: /app/samvera/hyrax-webapp/public/system
      subPath: public-system
  # sane default server block (keepalive, open_file_cache, hoisted proxy headers, asset paths) comes from the chart; below is only what this app adds on top
  extraHttpConfig: |-
    map ${DOLLAR}status ${DOLLAR}loggable {
        ~^444  0;
        default 1;
    }

    log_format loki 'host=${DOLLAR}host ip=${DOLLAR}http_x_forwarded_for remote_user=${DOLLAR}remote_user [${DOLLAR}time_local] '
                      'request="${DOLLAR}request" status=${DOLLAR}status bytes=${DOLLAR}body_bytes_sent '
                      'referer="${DOLLAR}http_referer" agent="${DOLLAR}http_user_agent" request_time=${DOLLAR}request_time upstream_response_time=${DOLLAR}upstream_response_time upstream_response_length=${DOLLAR}upstream_response_length';

    # Cloudflare ips see for refresh
    # https://support.cloudflare.com/hc/en-us/articles/200170786-Restoring-original-visitor-IPs-logging-visitor-IP-addresses
    # update list https://www.cloudflare.com/ips/
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;

    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
  accessLogFormat: loki
