name: "Build Test Lint"
run-name: Build Test Lint of ${{ github.ref_name }} by @${{ github.actor }}

on:
  push:
    branches:
      - main
      - staging
      - production
  pull_request:
    branches:
      - main
      - staging
      - production
  workflow_dispatch:
    inputs:
      debug_step:
        required: false
        description: 'Pause the selected step to debug using tmate'
        type: choice
        default: ''
        options:
          - ''
          - build
          - test
          - lint

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Knapsack version matches the pinned Hyku
        run: |
          knapsack=$(grep -oE "VERSION = ['\"][^'\"]+" lib/hyku_knapsack/version.rb | cut -c12-)
          hyku=$(grep -oE "VERSION = ['\"][^'\"]+" hyrax-webapp/config/initializers/version.rb | cut -c12-)
          if [ -z "$knapsack" ] || [ "$knapsack" != "$hyku" ]; then
            echo "::error file=lib/hyku_knapsack/version.rb::HykuKnapsack::VERSION is '$knapsack' but hyrax-webapp pins Hyku '$hyku'. Set it to '$hyku' in lib/hyku_knapsack/version.rb."
            exit 1
          fi
          echo "HykuKnapsack::VERSION $knapsack matches Hyku $hyku"

  build:
    permissions: write-all
    uses: notch8/actions/.github/workflows/build.yaml@v1.0.10
    secrets: inherit
    with:
      components: '["web","worker","solr","nginx"]'

  test:
    needs: build
    uses: notch8/actions/.github/workflows/test.yaml@v1.0.10
    with:
      confdir: "/app/samvera/hyrax-webapp/solr/conf"
      rspec_cmd: "cd .. && gem install semaphore_test_boosters && bundle && rspec_booster --job $CI_NODE_INDEX/$CI_NODE_TOTAL"

  lint:
    needs: build
    uses: notch8/actions/.github/workflows/lint.yaml@v1.0.10
    with:
      rubocop_cmd: "cd .. && bundle && bundle exec rubocop --parallel --format progress --format junit --out rubocop.xml"

  reports:
    if: always()
    needs: [test, lint]
    uses: notch8/actions/.github/workflows/report.yaml@v1.0.10