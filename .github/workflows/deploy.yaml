name: "Deploy"
# Same shape as samvera/hyku: Build Test Lint builds and tests, and this workflow deploys the commit
# it tested once it passes. A push to main deploys dev, staging deploys staging, production deploys
# production (after the environment's approval) and then publishes the release. Run it by hand to
# deploy a branch or tag ad hoc, or to roll back.
run-name: Deploy (${{ github.event.workflow_run.head_branch || github.ref_name }} -> ${{ inputs.environment || (github.event.workflow_run.head_branch == 'main' && 'dev') || github.event.workflow_run.head_branch }}) ${{ github.event.workflow_run.head_sha || github.sha }} by @${{ github.actor }}
on:
  workflow_run:
    workflows: ["Build Test Lint"]
    types: [completed]
    branches:
      - main
      - staging
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - dev
          - staging
          - production
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

jobs:
  # A pull request's Build Test Lint run can also come from a branch named staging (a promotion
  # PR), so only a green push deploys.
  determine-environment:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set.outputs.environment }}
    steps:
      - id: set
        name: Map branch or input to the target environment
        env:
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=$INPUT_ENVIRONMENT" >> "$GITHUB_OUTPUT"
          else
            case "$HEAD_BRANCH" in
              main) echo "environment=dev" >> "$GITHUB_OUTPUT" ;;
              staging|production) echo "environment=$HEAD_BRANCH" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

  # The shared workflow's setup step deploys github.event.workflow_run.head_sha, the commit
  # Build Test Lint tested, not the default branch.
  deploy:
    needs: determine-environment
    concurrency:
      group: deploy-${{ needs.determine-environment.outputs.environment }}
      cancel-in-progress: false
    uses: notch8/actions/.github/workflows/deploy.yaml@v1.0.16
    secrets: inherit
    with:
      environment: ${{ needs.determine-environment.outputs.environment }}

  # A job here, not a separate workflow triggered by this one: a second workflow_run hop reports
  # the default branch as its branch, so a production filter there never matches.
  publish-release:
    needs: deploy
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'production' }}
    permissions:
      actions: read
      contents: write
    uses: notch8/actions/.github/workflows/publish-release.yaml@v1.0.16
    with:
      sha: ${{ github.event.workflow_run.head_sha }}
      deploy-run-id: ${{ github.run_id }}
